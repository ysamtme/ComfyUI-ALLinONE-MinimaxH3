name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and unit checks
        run: |
          python -m py_compile nodes.py tests/test_backend.py tests/validate_workflows.py
          python -m unittest discover -s tests -p 'test_*.py'
          python tests/validate_workflows.py
          node --check web/one_node_minimax_h3.js
          node --test tests/frontend_helpers.test.mjs
